[project]
name = "math_llm_tutor"
version = "0.1.0"
description = "Math Education System with LLM and SymPy"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "sqlmodel>=0.0.8",
    "langchain>=0.0.267",
    "sympy>=1.12",
    "python-multipart>=0.0.6",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "pandas>=2.0.0",
    "openai>=0.27.0"
]

[tool.pyright]
include = ["backend"]
