server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 同源反代：浏览器只访问 nginx，不直连后端端口 —— 无跨域、后端端口无需对外暴露。
    # 注意 location 与 proxy_pass 的尾斜杠必须配对：这样 nginx 会把匹配到的 /api/
    # 前缀替换为 /，即 /api/user/login → http://backend:3000/user/login。
    # 后端没有 setGlobalPrefix('api')，若 proxy_pass 写成不带尾斜杠的
    # http://backend:3000，nginx 会原样转发 /api/user/login，后端必然 404。
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # 多智能体求解是同步长任务（数十秒），超时必须大于后端 axios 的 180s，
        # 否则网关先断开，前端拿到 504 而看不到后端的结构化错误。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 75s;
    }

    # Swagger UI 由后端自己挂在 /api/docs（**自带 api 前缀**），必须原样透传，
    # 否则会被上面的去前缀规则改写成 /docs → 404。
    # 前缀更长者优先，因此这条会覆盖 /api/ 规则。
    location ^~ /api/docs {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(html)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
