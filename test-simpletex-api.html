<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleTex 轻量API测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        .result { margin-top: 10px; padding: 10px; background: #f5f5f5; border-radius: 3px; }
        .error { color: red; }
        .success { color: green; }
        #drawingArea { 
            width: 400px; 
            height: 200px; 
            border: 1px solid #ddd; 
            margin: 10px 0; 
            cursor: crosshair;
        }
        .controls { margin: 10px 0; }
    </style>
</head>
<body>
    <h1>SimpleTex 轻量API测试</h1>
    <p>轻量API (latex_ocr_turbo) 用于识别基础数学公式，主要集成在手写模式中。</p>
    
    <div class="test-section">
        <h2>配置</h2>
        <label>API URL: <input type="text" id="apiUrl" value="https://server.simpletex.cn/api/latex_ocr_turbo" size="50"></label><br>
        <label>API Key: <input type="text" id="apiKey" value="Iem7F0CtKdDZ923rKOhp3IjfhoX6413KtBeeOOupzOMoIpv9YkeScgLBywoKykDn" size="50"></label><br>
        <label>使用CORS代理: <input type="checkbox" id="useProxy"></label><br>
    </div>
    
    <div class="test-section">
        <h2>手写输入测试</h2>
        <div id="drawingArea"></div>
        <div class="controls">
            <button onclick="clearDrawing()">清除</button>
            <button onclick="testApiCall()">识别公式</button>
        </div>
        <div id="apiResult" class="result"></div>
    </div>

    <script>
        // CORS代理URL
        const CORS_PROXY = 'https://cors-anywhere.herokuapp.com/';
        
        // 画布相关变量
        let canvas, ctx, isDrawing = false, lastX = 0, lastY = 0;
        
        // 初始化画布
        function initCanvas() {
            const drawingArea = document.getElementById('drawingArea');
            canvas = document.createElement('canvas');
            canvas.width = drawingArea.clientWidth;
            canvas.height = drawingArea.clientHeight;
            drawingArea.appendChild(canvas);
            
            ctx = canvas.getContext('2d');
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#000';
            
            // 鼠标事件
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);
        }
        
        // 开始绘制
        function startDrawing(e) {
            isDrawing = true;
            [lastX, lastY] = [e.offsetX, e.offsetY];
        }
        
        // 绘制
        function draw(e) {
            if (!isDrawing) return;
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.stroke();
            [lastX, lastY] = [e.offsetX, e.offsetY];
        }
        
        // 停止绘制
        function stopDrawing() {
            isDrawing = false;
        }
        
        // 清除画布
        function clearDrawing() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
        
        // 测试API调用
        async function testApiCall() {
            const apiUrl = document.getElementById('apiUrl').value;
            const apiKey = document.getElementById('apiKey').value;
            const useProxy = document.getElementById('useProxy').checked;
            
            // 将画布转换为图片
            canvas.toBlob(async (blob) => {
                if (!blob) {
                    alert('无法获取画布内容');
                    return;
                }
                
                const formData = new FormData();
                formData.append('file', blob, 'drawing.png');

                const headers = {
                    'Authorization': `Bearer ${apiKey}`
                };
                
                const resultDiv = document.getElementById('apiResult');
                resultDiv.innerHTML = `
                    <p>正在调用API...</p>
                    <p>API URL: ${apiUrl}</p>
                    <p>使用CORS代理: ${useProxy ? '是' : '否'}</p>
                    <p>Headers: ${JSON.stringify(headers)}</p>
                    <p>浏览器: ${navigator.userAgent}</p>
                    <p>当前URL: ${window.location.href}</p>
                `;

                try {
                    console.log('开始API调用', { 
                        apiUrl, 
                        useProxy, 
                        headers,
                        browser: navigator.userAgent,
                        currentUrl: window.location.href
                    });
                    
                    // 构建请求URL
                    let requestUrl = apiUrl;
                    if (useProxy) {
                        requestUrl = CORS_PROXY + apiUrl;
                        console.log('使用CORS代理:', requestUrl);
                    }
                    
                    // 确保不设置Content-Type头，让浏览器自动处理
                    const fetchHeaders = { ...headers };
                    // 移除可能的Content-Type头，避免冲突
                    delete fetchHeaders['Content-Type'];
                    
                    console.log('请求配置:', {
                        url: requestUrl,
                        method: 'POST',
                        headers: fetchHeaders,
                        body: formData,
                        credentials: 'omit',
                        mode: 'cors'
                    });
                    
                    // 添加请求超时处理
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 30000); // 30秒超时
                    
                    const response = await fetch(requestUrl, {
                        method: 'POST',
                        headers: fetchHeaders,
                        body: formData,
                        credentials: 'omit', // 不发送凭证，避免CORS问题
                        mode: 'cors', // 明确指定CORS模式
                        signal: controller.signal
                    });
                    
                    clearTimeout(timeoutId);

                    console.log('API响应状态:', response.status, response.statusText);
                    console.log('API响应头:', Object.fromEntries(response.headers.entries()));
                    
                    // 尝试获取响应文本
                    const responseText = await response.text();
                    console.log('API响应文本:', responseText);
                    
                    let data;
                    try {
                        data = JSON.parse(responseText);
                        console.log('API响应数据:', data);
                    } catch (jsonError) {
                        console.error('JSON解析错误:', jsonError);
                        data = { error: 'Invalid JSON response', responseText: responseText };
                    }
                    
                    if (response.ok) {
                        resultDiv.innerHTML = `
                            <h3>API调用结果</h3>
                            <p class="success">调用成功!</p>
                            <p>状态码: ${response.status} ${response.statusText}</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        `;
                    } else {
                        resultDiv.innerHTML = `
                            <h3>API调用结果</h3>
                            <p class="error">调用失败: ${response.status} ${response.statusText}</p>
                            <p>响应文本: ${responseText}</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        `;
                    }
                } catch (error) {
                    console.error('API调用错误:', error);
                    console.error('错误类型:', error.name);
                    console.error('错误堆栈:', error.stack);
                    
                    let errorMessage = error.message;
                    let errorSuggestion = '';
                    
                    if (error.name === 'AbortError') {
                        errorMessage = '请求超时，请检查网络连接';
                        errorSuggestion = '尝试检查网络连接或使用CORS代理';
                    } else if (error.message.includes('Failed to fetch')) {
                        errorMessage = '网络请求失败';
                        errorSuggestion = '可能是CORS跨域问题、网络连接问题或API服务器问题';
                    } else if (error.message.includes('NetworkError')) {
                        errorMessage = '网络错误';
                        errorSuggestion = '检查网络连接是否正常';
                    }
                    
                    resultDiv.innerHTML = `
                        <h3>API调用结果</h3>
                        <p class="error">错误: ${errorMessage}</p>
                        <p>错误类型: ${error.name}</p>
                        <p>错误详情: ${error.stack}</p>
                        <p>可能的原因: ${errorSuggestion}</p>
                        <p>尝试: ${useProxy ? '禁用CORS代理' : '启用CORS代理'}</p>
                        <p>请检查浏览器控制台获取更多详细信息</p>
                    `;
                }
            }, 'image/png');
        }
        
        // 页面加载完成后初始化画布
        window.onload = initCanvas;
    </script>
</body>
</html>
